<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0d1124"/><stop offset="100%" stop-color="#140c26"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="20"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="shadow" width="110%" height="110%" x="-5%" y="-5%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.12)}}@keyframes radarSweep{0%{transform:rotate(0deg)}}.badge-text,.stat-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.stat-text{font-weight:700;font-size:14px;fill:#38bdf8}.matrix-node{font-family:&quot;JetBrains Mono&quot;,Consolas,monospace;font-size:11px;fill:#64748b}.floating-card-1{animation:floatSlow 7s ease-in-out infinite}.floating-card-2{animation:floatReverse 6s ease-in-out infinite}.floating-card-3{animation:floatSlow 8s ease-in-out infinite 1s}.pulsing-orb-1{transform-origin:200px 100px;animation:pulseGlow 6s ease-in-out infinite}.pulsing-orb-2{transform-origin:1000px 300px;animation:pulseGlow 5s ease-in-out infinite 2s}.radar-line{transform-origin:1050px 120px;animation:radarSweep 10s linear infinite}.stream-path{stroke-dasharray:8 6;animation:dashMove 4s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><g class="pulsing-orb-1"><circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glowCyan)" opacity=".18"/></g><g class="pulsing-orb-2"><circle cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#glowPurple)" opacity=".18"/></g><g stroke="#334155" stroke-opacity=".25" stroke-width="1"><line x1="80" x2="80" y1="0" y2="420"/><line x1="200" x2="200" y1="0" y2="420"/><line x1="320" x2="320" y1="0" y2="420"/><line x1="440" x2="440" y1="0" y2="420"/><line x1="560" x2="560" y1="0" y2="420"/><line x1="680" x2="680" y1="0" y2="420"/><line x1="800" x2="800" y1="0" y2="420"/><line x1="920" x2="920" y1="0" y2="420"/><line x1="1040" x2="1040" y1="0" y2="420"/><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/></g><path fill="none" stroke="#6366f1" stroke-width="2" d="M 120 340 C 300 380, 500 280, 800 350 S 1080 260, 1150 180" class="stream-path" opacity=".4"/><path fill="none" stroke="#0ea5e9" stroke-width="2" d="M 50 120 C 350 40, 650 180, 950 80 S 1100 120, 1180 60" class="stream-path" opacity=".3"/><g opacity=".6"><circle cx="1050" cy="120" r="70" fill="none" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="1050" cy="120" r="45" fill="none" stro