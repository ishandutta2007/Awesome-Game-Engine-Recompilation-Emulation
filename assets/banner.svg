<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#140c26" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .stat-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #38bdf8;
      }
      .matrix-node {
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 11px;
        fill: #64748b;
      }

      /* Dynamic Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.12); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }

      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .floating-card-3 {
        animation: floatSlow 8s ease-in-out infinite 1s;
      }
      .pulsing-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .pulsing-orb-2 {
        transform-origin: 1000px 300px;
        animation: pulseGlow 5s ease-in-out infinite 2s;
      }
      .radar-line {
        transform-origin: 1050px 120px;
        animation: radarSweep 10s linear infinite;
      }
      .stream-path {
        stroke-dasharray: 8 6;
        animation: dashMove 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Glowing Orbs -->
  <g class="pulsing-orb-1">
    <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.18" filter="url(#glowCyan)" />
  </g>
  <g class="pulsing-orb-2">
    <circle cx="1020" cy="300" r="160" fill="#a855f7" opacity="0.18" filter="url(#glowPurple)" />
  </g>

  <!-- Interactive Grid Background Pattern -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="920" y1="0" x2="920" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />

    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Animated Data Transmission Lines in Background -->
  <path d="M 120 340 C 300 380, 500 280, 800 350 S 1080 260, 1150 180" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" class="stream-path" />
  <path d="M 50 120 C 350 40, 650 180, 950 80 S 1100 120, 1180 60" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" class="stream-path" />

  <!-- Animated Radar / Core Node in Right Background -->
  <g opacity="0.6">
    <circle cx="1050" cy="120" r="70" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1050" cy="120" r="45" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle cx="1050" cy="120" r="20" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <line x1="1050" y1="120" x2="1115" y2="120" stroke="#38bdf8" stroke-width="2" class="radar-line" />
  </g>

  <!-- Animated Floating Dynamic Pills & Cards (Positioned gracefully around text) -->
  <!-- Floating Card 1: Static Recompilation -->
  <g class="floating-card-1" transform="translate(860, 50)" filter="url(#shadow)">
    <rect width="270" height="72" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="32" cy="36" r="14" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <text x="32" y="41" text-anchor="middle" font-size="14" fill="#38bdf8">⚡</text>
    <text x="60" y="32" class="badge-text">Static Recompilation</text>
    <text x="60" y="52" class="matrix-node">N64Recomp • XenonRecomp</text>
  </g>

  <!-- Floating Card 2: Engine Reimplementations -->
  <g class="floating-card-2" transform="translate(890, 150)" filter="url(#shadow)">
    <rect width="250" height="72" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="32" cy="36" r="14" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.5" />
    <text x="32" y="41" text-anchor="middle" font-size="14" fill="#818cf8">🎮</text>
    <text x="60" y="32" class="badge-text">Native Engine Ports</text>
    <text x="60" y="52" class="matrix-node">OpenMW • OpenRCT2 • DevilutionX</text>
  </g>

  <!-- Floating Card 3: Cloud Gaming & Emulation -->
  <g class="floating-card-3" transform="translate(840, 250)" filter="url(#shadow)">
    <rect width="280" height="72" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="32" cy="36" r="14" fill="#9333ea" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5" />
    <text x="32" y="41" text-anchor="middle" font-size="14" fill="#c084fc">🚀</text>
    <text x="60" y="32" class="badge-text">Precision Emulation &amp; Cloud</text>
    <text x="60" y="52" class="matrix-node">RPCS3 • Dolphin • Sunshine/Moonlight</text>
  </g>

  <!-- ================= FOREGROUND (Always Crisp, Unobstructed & Centered) ================= -->
  <g transform="translate(70, 70)">
    <!-- Category Badge Tag -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text" fill="#38bdf8">CURATED AWESOME ECOSYSTEM 2026</text>

    <!-- Main Title (Gradient Fill, Crisp Drop Shadow) -->
    <text x="0" y="85" class="title-text" filter="url(#shadow)">
      Game Engine Recompilation
    </text>
    <text x="0" y="135" class="title-text" fill="url(#accentGrad)" filter="url(#shadow)">
      &amp; High-Precision Emulation
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="180" class="subtitle-text">
      Binary Recompilation • Native Engine Remakes • Decompilation • Cloud Streaming
    </text>

    <!-- Interactive Key Stats & Tech Highlights -->
    <g transform="translate(0, 220)">
      <!-- Pill 1: Total Stars -->
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="23" font-size="13" fill="#94a3b8">⭐ OSS Stars:</text>
      <text x="96" y="23" class="stat-text">300k+ Total</text>

      <!-- Pill 2: High FPS Native -->
      <rect x="180" y="0" width="165" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="194" y="23" font-size="13" fill="#94a3b8">⚡ Performance:</text>
      <text x="286" y="23" class="stat-text" fill="#4ade80">240 FPS+</text>

      <!-- Pill 3: Recomp Toolchains -->
      <rect x="360" y="0" width="175" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="374" y="23" font-size="13" fill="#94a3b8">🛠️ Toolchains:</text>
      <text x="462" y="23" class="stat-text" fill="#c084fc">Ghidra / Splat</text>

      <!-- Pill 4: Preservation Mode -->
      <rect x="550" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="564" y="23" font-size="13" fill="#94a3b8">🕹️ Preservation:</text>
      <text x="656" y="23" class="stat-text" fill="#f59e0b">Cycle-Accurate</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="414" width="1200" height="6" rx="3" fill="url(#accentGrad)" />
</svg>
